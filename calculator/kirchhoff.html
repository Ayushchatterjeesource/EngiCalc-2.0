<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirchhoff Calculator - EngiCalc 2.0</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}
header{background:#111827;color:white;text-align:center;padding:18px}header a{color:white;text-decoration:none}
header img{width:50px;vertical-align:middle}
.container{max-width:700px;margin:25px auto;padding:15px}.card{background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#2563eb;color:white;border:0;font-weight:bold}.result{background:#eff6ff;padding:18px;margin-top:15px;border-radius:12px}
</style>
</head>
<body>
<header><a href="../index.html"><img src="../engicalc2.0-logo.png"> <b>EngiCalc 2.0</b></a></header>

<div class="container"><div class="card">
<h2>Kirchhoff's Law Calculator</h2>

<select id="law">
<option value="kcl">KCL - Current Law</option>
<option value="kvl">KVL - Voltage Law</option>
</select>

<p>Enter values separated by commas.</p>

<input id="values" placeholder="Example: 2, 3, 5">

<select id="sign">
<option value="sum">Calculate total</option>
<option value="balance">Calculate balance</option>
</select>

<button onclick="calculate()">Calculate</button>
<div id="result"></div>
</div></div>

<script>
function calculate(){
let law=document.getElementById("law").value;
let vals=document.getElementById("values").value.split(",").map(Number).filter(Number.isFinite);
let total=vals.reduce((a,b)=>a+b,0);

if(!vals.length){
result.innerHTML='<div class="result">Please enter valid numbers.</div>';
return;
}

if(law==="kcl"){
result.innerHTML=`<div class="result">
<b>KCL:</b> Sum of currents at a node = 0

Entered currents: ${vals.join(", ")}

Magnitude total = ${total}

For a complete KCL equation, assign incoming currents positive and outgoing currents negative.
</div>`;
}else{
result.innerHTML=`<div class="result">
<b>KVL:</b> Sum of voltages around a closed loop = 0

Entered voltages: ${vals.join(", ")}

Algebraic sum = ${total}

For a complete KVL equation, assign voltage rises positive and drops negative.
</div>`;
}
}
</script>
</body>
</html>
