<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Statistics - EngiCalc 2.0</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header><div class="navbar"><a href="../index.html" style="text-decoration: none; color: var(--primary-blue);">← Back</a><span>Statistics</span></div></header>
    <div style="max-width: 500px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center;">
        <h3>Mean Calculator</h3>
        <p>Enter numbers separated by commas (e.g. 10, 20, 30)</p>
        <input type="text" id="statInput" style="width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px; border: 1px solid #ccc; background: var(--bg-color); color: var(--text-color);">
        <button onclick="calcStat()" style="width:100%; padding:15px; background:var(--primary-blue); color:white; border:none; border-radius:10px; cursor:pointer;">Calculate Mean</button>
        <div id="statRes" style="font-size: 1.5rem; color: var(--primary-blue); margin-top: 20px;">Result: 0</div>
    </div>
    <script>
        function calcStat() {
            let val = document.getElementById('statInput').value;
            let arr = val.split(',').map(Number);
            let sum = arr.reduce((a, b) => a + b, 0);
            let mean = sum / arr.length;
            document.getElementById('statRes').innerText = "Mean: " + (mean || 0).toFixed(2);
        }
    </script>
</body>
</html>
