<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrix Calculator - EngiCalc 2.0</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .matrix-grid { display: grid; grid-template-columns: 80px 80px; gap: 10px; justify-content: center; margin: 20px 0; }
        .matrix-grid input { width: 80px; padding: 15px; text-align: center; border-radius: 8px; border: 1px solid #ccc; background: var(--bg-color); color: var(--text-color); font-size: 1.2rem; }
        .calc-container { max-width: 500px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center; box-shadow: var(--shadow); }
        .res-text { font-size: 1.5rem; color: var(--primary-blue); font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <header><div class="navbar"><a href="../index.html" style="text-decoration: none; color: var(--primary-blue);">← Back</a><span>Matrix (2x2)</span></div></header>
    <div class="calc-container">
        <h3>Determinant Calculator</h3>
        <div class="matrix-grid">
            <input type="number" id="a11" placeholder="a11">
            <input type="number" id="a12" placeholder="a12">
            <input type="number" id="a21" placeholder="a21">
            <input type="number" id="a22" placeholder="a22">
        </div>
        <button class="btn-calc" style="width:100%; padding:15px; background:var(--primary-blue); color:white; border:none; border-radius:10px; cursor:pointer;" onclick="calcDet()">Calculate Determinant</button>
        <div class="res-text" id="detRes">Result: 0</div>
    </div>
    <script>
        function calcDet() {
            let a = parseFloat(document.getElementById('a11').value) || 0;
            let b = parseFloat(document.getElementById('a12').value) || 0;
            let c = parseFloat(document.getElementById('a21').value) || 0;
            let d = parseFloat(document.getElementById('a22').value) || 0;
            let det = (a * d) - (b * c);
            document.getElementById('detRes').innerText = "Determinant: " + det;
        }
    </script>
</body>
</html>
