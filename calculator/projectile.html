<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projectile Calculator - EngiCalc 2.0</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}
header{background:#111827;color:white;text-align:center;padding:18px}header a{color:white;text-decoration:none}
header img{width:50px;vertical-align:middle}
.container{max-width:700px;margin:25px auto;padding:15px}.card{background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#2563eb;color:white;border:0;font-weight:bold}.result{background:#eff6ff;padding:18px;margin-top:15px;border-radius:12px;line-height:1.8}
</style>
</head>
<body>
<header><a href="../index.html"><img src="../engicalc2.0-logo.png"> <b>EngiCalc 2.0</b></a></header>

<div class="container"><div class="card">
<h2>Projectile Motion Calculator</h2>

<input id="u" type="number" placeholder="Initial velocity u (m/s)">
<input id="angle" type="number" placeholder="Angle θ (degrees)">
<input id="h" type="number" placeholder="Initial height (m)" value="0">

<button onclick="calculate()">Calculate</button>
<div id="result"></div>
</div></div>

<script>
function calculate(){
let u=+document.getElementById("u").value;
let angle=+document.getElementById("angle").value;
let h=+document.getElementById("h").value;
let g=9.81;

let rad=angle*Math.PI/180;
let ux=u*Math.cos(rad);
let uy=u*Math.sin(rad);

let time=(uy+Math.sqrt(uy*uy+2*g*h))/g;
let range=ux*time;
let maxHeight=h+(uy*uy)/(2*g);

result.innerHTML=`<div class="result">
<b>Horizontal velocity:</b> ${ux.toFixed(3)} m/s

<b>Vertical velocity:</b> ${uy.toFixed(3)} m/s

<b>Time of flight:</b> ${time.toFixed(3)} s

<b>Horizontal range:</b> ${range.toFixed(3)} m

<b>Maximum height:</b> ${maxHeight.toFixed(3)} m

<b>Gravity:</b> 9.81 m/s²
</div>`;
}
</script>
</body>
</html>
