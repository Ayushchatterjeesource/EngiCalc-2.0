<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projectile Motion - EngiCalc 2.0</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .input-group { margin: 15px 0; text-align: left; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; background: var(--bg-color); color: var(--text-color); }
        .calc-container { max-width: 500px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow); }
        .res-list { margin-top: 20px; padding: 15px; background: var(--bg-color); border-radius: 10px; text-align: left; }
    </style>
</head>
<body>
    <header><div class="navbar"><a href="../index.html" style="text-decoration: none; color: var(--primary-blue);">← Back</a><span>Projectile Motion</span></div></header>
    <div class="calc-container">
        <h3>Projectile Calculator</h3>
        <div class="input-group">
            <label>Initial Velocity (m/s)</label>
            <input type="number" id="velocity" placeholder="e.g. 20">
        </div>
        <div class="input-group">
            <label>Launch Angle (degrees)</label>
            <input type="number" id="angle" placeholder="e.g. 45">
        </div>
        <button onclick="calcProj()" style="width:100%; padding:15px; background:var(--primary-blue); color:white; border:none; border-radius:10px; cursor:pointer;">Calculate</button>
        <div class="res-list" id="projRes">
            <p>Max Height: -</p>
            <p>Total Range: -</p>
            <p>Time of Flight: -</p>
        </div>
    </div>
    <script>
        function calcProj() {
            let v = parseFloat(document.getElementById('velocity').value);
            let a = parseFloat(document.getElementById('angle').value);
            let g = 9.81;
            let rad = a * (Math.PI / 180);

            let height = (Math.pow(v, 2) * Math.pow(Math.sin(rad), 2)) / (2 * g);
            let range = (Math.pow(v, 2) * Math.sin(2 * rad)) / g;
            let time = (2 * v * Math.sin(rad)) / g;

            document.getElementById('projRes').innerHTML = `
                <p>Max Height: <b>${height.toFixed(2)} m</b></p>
                <p>Total Range: <b>${range.toFixed(2)} m</b></p>
                <p>Time of Flight: <b>${time.toFixed(2)} s</b></p>
            `;
        }
    </script>
</body>
</html>
