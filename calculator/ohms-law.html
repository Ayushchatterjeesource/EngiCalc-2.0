<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohm's Law - EngiCalc 2.0</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .calc-container { max-width: 600px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; background: var(--bg-color); color: var(--text-color); }
        .result-box { margin-top: 25px; padding: 20px; background: var(--primary-blue); color: white; border-radius: 10px; text-align: center; font-size: 1.5rem; display: none; }
        .btn-calc { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--primary-blue); color: white; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="../index.html" style="text-decoration: none; color: var(--primary-blue); font-weight: bold;">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            <span style="font-weight: bold;">Ohm's Law</span>
        </div>
    </header>

    <div class="calc-container">
        <h2>Ohm's Law Calculator</h2>
        <p>Leave one field blank to calculate its value.</p><br>
        
        <div class="input-group">
            <label>Voltage (V) - Volts</label>
            <input type="number" id="voltage" placeholder="Enter Voltage">
        </div>
        <div class="input-group">
            <label>Current (I) - Amps</label>
            <input type="number" id="current" placeholder="Enter Current">
        </div>
        <div class="input-group">
            <label>Resistance (R) - Ohms</label>
            <input type="number" id="resistance" placeholder="Enter Resistance">
        </div>

        <button class="btn-calc" onclick="calculateOhms()">Calculate</button>
        <div id="result" class="result-box"></div>
    </div>
