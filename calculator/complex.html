<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Complex Number Calculator - EngiCalc 2.0</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .tool-container {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .tool-container h2 {
            color: var(--text-white);
            margin-bottom: 18px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tool-container h2 .badge {
            font-size: 12px;
            background: var(--accent-purple);
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-white);
            font-size: 16px;
        }
        .input-group input:focus, .input-group select:focus {
            outline: 2px solid var(--accent-blue);
        }
        .complex-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .complex-inputs input {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-white);
            font-size: 16px;
            text-align: center;
        }
        .complex-inputs input:focus {
            outline: 2px solid var(--accent-blue);
        }
        .result-box {
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-cyan);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 6px;
        }
        .result-box .sub-result {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .result-box .result-main {
            font-size: 26px;
        }
        .btn-calculate {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 14px 30px;
            border-radius: var(--radius-sm);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            transition: opacity 0.2s;
        }
        .btn-calculate:active {
            transform: scale(0.97);
        }
        .btn-calculate:hover {
            opacity: 0.9;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            float: right;
        }
        .back-btn:hover {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }
        .back-btn:active {
            transform: scale(0.95);
        }
        .complex-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 4px;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        /* Polar form display */
        .polar-display {
            margin-top: 10px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-secondary);
        }
        .polar-display strong {
            color: var(--accent-cyan);
        }
        .result-extra {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }
        .result-extra .extra-item {
            background: var(--bg-card);
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-size: 13px;
        }
        .result-extra .extra-item .elabel {
            color: var(--text-secondary);
            font-size: 10px;
            text-transform: uppercase;
        }
        .result-extra .extra-item .evalue {
            color: var(--accent-cyan);
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo-area">
                <img src="../engicalc2.0-logo.png" alt="EngiCalc Logo" class="logo-img" 
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%2210%22 fill=%22%233b82f6%22/%3E%3Ctext x=%2220%22 y=%2228%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22 font-weight=%22bold%22%3E⚙%3C/text%3E%3C/svg%3E'">
                <span class="logo-text">Engi<span>Calc</span> 2.0</span>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </header>

        <!-- Back to Home - Right Side -->
        <div class="clearfix">
            <a href="../index.html" class="back-btn">← Back to Home</a>
        </div>

        <div class="tool-container">
            <h2>
                i Complex Number Calculator
                <span class="badge">Advanced</span>
            </h2>

            <div class="input-group">
                <label>Complex Number Z₁</label>
                <div class="complex-inputs">
                    <div>
                        <div class="complex-label">Real (a)</div>
                        <input type="number" id="a1" value="3" step="any">
                    </div>
                    <div>
                        <div class="complex-label">Imaginary (b)</div>
                        <input type="number" id="b1" value="4" step="any">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Complex Number Z₂</label>
                <div class="complex-inputs">
                    <div>
                        <div class="complex-label">Real (c)</div>
                        <input type="number" id="a2" value="1" step="any">
                    </div>
                    <div>
                        <div class="complex-label">Imaginary (d)</div>
                        <input type="number" id="b2" value="2" step="any">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Operation</label>
                <select id="operation">
                    <option value="add">Addition (Z₁ + Z₂)</option>
                    <option value="subtract">Subtraction (Z₁ - Z₂)</option>
                    <option value="multiply">Multiplication (Z₁ × Z₂)</option>
                    <option value="divide">Division (Z₁ ÷ Z₂)</option>
                    <option value="conjugate1">Conjugate of Z₁</option>
                    <option value="conjugate2">Conjugate of Z₂</option>
                    <option value="modulus1">Modulus of Z₁</option>
                    <option value="modulus2">Modulus of Z₂</option>
                </select>
            </div>

            <button class="btn-calculate" id="calculateBtn">Calculate</button>

            <div class="result-box" id="resultDisplay">
                <div class="result-main">Result</div>
                <span class="sub-result">Enter values and click Calculate</span>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo-area">
                    <img src="../engicalc2.0-logo.png" alt="EngiCalc Logo" class="footer-logo-img" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2236%22%3E%3Crect width=%2236%22 height=%2236%22 rx=%228%22 fill=%22%233b82f6%22/%3E%3Ctext x=%2218%22 y=%2225%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2218%22 font-weight=%22bold%22%3E⚙%3C/text%3E%3C/svg%3E'">
                    <span class="footer-logo-text">Engi<span>Calc</span> 2.0</span>
                </div>
                <p class="footer-text">This EngiCalc is made by <strong>AyushChatterjee</strong></p>
                <p class="footer-text">Founder: <strong>EngiCalc2.0.com</strong></p>
                <p class="footer-copy">© 2026 EngiCalc 2.0. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="../script.js"></script>
    <script>
        document.getElementById('calculateBtn').addEventListener('click', function() {
            const a1 = parseFloat(document.getElementById('a1').value) || 0;
            const b1 = parseFloat(document.getElementById('b1').value) || 0;
            const a2 = parseFloat(document.getElementById('a2').value) || 0;
            const b2 = parseFloat(document.getElementById('b2').value) || 0;

            const operation = document.getElementById('operation').value;
            let real, imag, label, extra = '';

            // Helper: format complex number
            function formatComplex(r, i) {
                if (i === 0) return r.toFixed(4);
                if (r === 0) return i.toFixed(4) + 'i';
                return `${r.toFixed(4)} ${i >= 0 ? '+' : '-'} ${Math.abs(i).toFixed(4)}i`;
            }

            // Helper: modulus
            function modulus(r, i) {
                return Math.sqrt(r*r + i*i);
            }

            // Helper: argument (angle in degrees)
            function argument(r, i) {
                return Math.atan2(i, r) * 180 / Math.PI;
            }

            switch(operation) {
                case 'add':
                    real = a1 + a2;
                    imag = b1 + b2;
                    label = 'Z₁ + Z₂ =';
                    extra = `
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Modulus</span><div class="evalue">${modulus(real, imag).toFixed(4)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(real, imag).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Polar Form</span><div class="evalue">${modulus(real, imag).toFixed(2)} ∠ ${argument(real, imag).toFixed(2)}°</div></div>
                        </div>
                    `;
                    break;
                case 'subtract':
                    real = a1 - a2;
                    imag = b1 - b2;
                    label = 'Z₁ - Z₂ =';
                    extra = `
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Modulus</span><div class="evalue">${modulus(real, imag).toFixed(4)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(real, imag).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Polar Form</span><div class="evalue">${modulus(real, imag).toFixed(2)} ∠ ${argument(real, imag).toFixed(2)}°</div></div>
                        </div>
                    `;
                    break;
                case 'multiply':
                    real = a1*a2 - b1*b2;
                    imag = a1*b2 + b1*a2;
                    label = 'Z₁ × Z₂ =';
                    extra = `
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Modulus</span><div class="evalue">${modulus(real, imag).toFixed(4)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(real, imag).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Polar Form</span><div class="evalue">${modulus(real, imag).toFixed(2)} ∠ ${argument(real, imag).toFixed(2)}°</div></div>
                        </div>
                    `;
                    break;
                case 'divide':
                    const denom = a2*a2 + b2*b2;
                    if (denom === 0) {
                        document.getElementById('resultDisplay').innerHTML = '⚠️ Division by zero!';
                        return;
                    }
                    real = (a1*a2 + b1*b2) / denom;
                    imag = (b1*a2 - a1*b2) / denom;
                    label = 'Z₁ ÷ Z₂ =';
                    extra = `
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Modulus</span><div class="evalue">${modulus(real, imag).toFixed(4)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(real, imag).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Polar Form</span><div class="evalue">${modulus(real, imag).toFixed(2)} ∠ ${argument(real, imag).toFixed(2)}°</div></div>
                        </div>
                    `;
                    break;
                case 'conjugate1':
                    real = a1;
                    imag = -b1;
                    label = 'Conjugate of Z₁ =';
                    extra = `
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Modulus</span><div class="evalue">${modulus(real, imag).toFixed(4)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(real, imag).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Z₁ × Z̄₁</span><div class="evalue">${(a1*a1 + b1*b1).toFixed(4)}</div></div>
                        </div>
                    `;
                    break;
                case 'conjugate2':
                    real = a2;
                    imag = -b2;
                    label = 'Conjugate of Z₂ =';
                    extra = `
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Modulus</span><div class="evalue">${modulus(real, imag).toFixed(4)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(real, imag).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Z₂ × Z̄₂</span><div class="evalue">${(a2*a2 + b2*b2).toFixed(4)}</div></div>
                        </div>
                    `;
                    break;
                case 'modulus1':
                    const mod1 = modulus(a1, b1);
                    document.getElementById('resultDisplay').innerHTML = `
                        <div class="result-main">|Z₁| = ${mod1.toFixed(4)}</div>
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Z₁</span><div class="evalue">${formatComplex(a1, b1)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(a1, b1).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Polar Form</span><div class="evalue">${mod1.toFixed(2)} ∠ ${argument(a1, b1).toFixed(2)}°</div></div>
                        </div>
                        <span class="sub-result">Modulus of Z₁</span>
                    `;
                    return;
                case 'modulus2':
                    const mod2 = modulus(a2, b2);
                    document.getElementById('resultDisplay').innerHTML = `
                        <div class="result-main">|Z₂| = ${mod2.toFixed(4)}</div>
                        <div class="result-extra">
                            <div class="extra-item"><span class="elabel">Z₂</span><div class="evalue">${formatComplex(a2, b2)}</div></div>
                            <div class="extra-item"><span class="elabel">Argument</span><div class="evalue">${argument(a2, b2).toFixed(2)}°</div></div>
                            <div class="extra-item"><span class="elabel">Polar Form</span><div class="evalue">${mod2.toFixed(2)} ∠ ${argument(a2, b2).toFixed(2)}°</div></div>
                        </div>
                        <span class="sub-result">Modulus of Z₂</span>
                    `;
                    return;
                default:
                    real = a1;
                    imag = b1;
                    label = 'Z₁ =';
            }

            const resultStr = formatComplex(real, imag);
            document.getElementById('resultDisplay').innerHTML = `
                <div class="result-main">${label} ${resultStr}</div>
                ${extra}
                <span class="sub-result">Operation: ${document.getElementById('operation').selectedOptions[0].text}</span>
            `;
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('calculateBtn').click();
            }
        });

        // Initial calculation
        document.getElementById('calculateBtn').click();
    </script>
</body>
</html>
