<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complex Numbers - EngiCalc 2.0</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header><div class="navbar"><a href="../index.html" style="text-decoration: none; color: var(--primary-blue);">← Back</a><span>Complex Numbers</span></div></header>
    <div style="max-width: 500px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center;">
        <h3>Complex Addition (a + bi)</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="number" id="r1" placeholder="Real 1" style="width:50%; padding:10px;">
            <input type="number" id="i1" placeholder="Imaginary 1" style="width:50%; padding:10px;">
        </div>
        <p>+</p>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="number" id="r2" placeholder="Real 2" style="width:50%; padding:10px;">
            <input type="number" id="i2" placeholder="Imaginary 2" style="width:50%; padding:10px;">
        </div>
        <button onclick="calcComplex()" style="width:100%; margin-top:20px; padding:15px; background:var(--primary-blue); color:white; border:none; border-radius:10px; cursor:pointer;">Add Complex Numbers</button>
        <div id="compRes" style="font-size: 1.5rem; color: var(--primary-blue); margin-top: 20px;">Result: 0 + 0i</div>
    </div>
    <script>
        function calcComplex() {
            let r1 = parseFloat(document.getElementById('r1').value) || 0;
            let i1 = parseFloat(document.getElementById('i1').value) || 0;
            let r2 = parseFloat(document.getElementById('r2').value) || 0;
            let i2 = parseFloat(document.getElementById('i2').value) || 0;
            document.getElementById('compRes').innerText = `Result: ${r1+r2} + ${i1+i2}i`;
        }
    </script>
</body>
</html>
