<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - EngiCalc 2.0</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .calc-container { max-width: 500px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; background: var(--bg-color); color: var(--text-color); }
        .result { font-size: 1.8rem; color: var(--primary-blue); margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <header><div class="navbar"><a href="../index.html" class="back-btn">← Back</a><span>Unit Converter</span></div></header>

    <div class="calc-container">
        <h3>Length Converter</h3>
        <input type="number" id="inputValue" placeholder="Enter Value" oninput="convert()">
        <select id="fromUnit" onchange="convert()">
            <option value="m">Meter (m)</option>
            <option value="km">Kilometer (km)</option>
            <option value="feet">Feet</option>
            <option value="inch">Inch</option>
        </select>
        <p>to</p>
        <select id="toUnit" onchange="convert()">
            <option value="m">Meter (m)</option>
            <option value="km">Kilometer (km)</option>
            <option value="feet">Feet</option>
            <option value="inch">Inch</option>
        </select>
        <div class="result" id="unitResult">0</div>
    </div>

    <script>
        function convert() {
            let val = document.getElementById('inputValue').value;
            let from = document.getElementById('fromUnit').value;
            let to = document.getElementById('toUnit').value;
            
            // Basic Meter Conversion Table
            let factors = { m: 1, km: 1000, feet: 0.3048, inch: 0.0254 };
            let result = (val * factors[from]) / factors[to];
            document.getElementById('unitResult').innerHTML = result.toFixed(4);
        }
    </script>
</body>
</html>
