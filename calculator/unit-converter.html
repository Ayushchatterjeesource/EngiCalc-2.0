<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Converter - EngiCalc 2.0</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}
header{background:#111827;color:white;text-align:center;padding:18px}header a{color:white;text-decoration:none}
header img{width:50px;vertical-align:middle}
.container{max-width:700px;margin:25px auto;padding:15px}.card{background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#2563eb;color:white;border:0;font-weight:bold}.result{background:#eff6ff;padding:18px;margin-top:15px;border-radius:12px;font-size:20px}
</style>
</head>
<body>
<header><a href="../index.html"><img src="../engicalc2.0-logo.png"> <b>EngiCalc 2.0</b></a></header>

<div class="container"><div class="card">
<h2>Engineering Unit Converter</h2>

<input id="value" type="number" placeholder="Enter value">

<select id="type">
<option value="m-km">Meter → Kilometer</option>
<option value="km-m">Kilometer → Meter</option>
<option value="cm-m">Centimeter → Meter</option>
<option value="m-cm">Meter → Centimeter</option>
<option value="mm-m">Millimeter → Meter</option>
<option value="m-mm">Meter → Millimeter</option>
<option value="n-kn">Newton → Kilonewton</option>
<option value="kn-n">Kilonewton → Newton</option>
<option value="pa-kpa">Pascal → Kilopascal</option>
<option value="kpa-pa">Kilopascal → Pascal</option>
<option value="w-kw">Watt → Kilowatt</option>
<option value="kw-w">Kilowatt → Watt</option>
<option value="c-f">Celsius → Fahrenheit</option>
<option value="f-c">Fahrenheit → Celsius</option>
</select>

<button onclick="convert()">Convert</button>
<div id="result"></div>
</div></div>

<script>
function convert(){
let v=+document.getElementById("value").value;
let t=document.getElementById("type").value;
let r;

switch(t){
case"m-km":r=v/1000;break;
case"km-m":r=v*1000;break;
case"cm-m":r=v/100;break;
case"m-cm":r=v*100;break;
case"mm-m":r=v/1000;break;
case"m-mm":r=v*1000;break;
case"n-kn":r=v/1000;break;
case"kn-n":r=v*1000;break;
case"pa-kpa":r=v/1000;break;
case"kpa-pa":r=v*1000;break;
case"w-kw":r=v/1000;break;
case"kw-w":r=v*1000;break;
case"c-f":r=v*9/5+32;break;
case"f-c":r=(v-32)*5/9;break;
}

result.innerHTML=`<div class="result"><b>Result:</b> ${r.toFixed(6)}</div>`;
}
</script>
</body>
</html>
