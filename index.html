<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiCalc 2.0 - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="engicalc2.0-logo.png" alt="Logo">
                <span>EngiCalc 2.0</span>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Engineering Blueprint 2.0</h1>
            <div class="search-container">
                <input type="text" id="search" placeholder="Search for calculators...">
            </div>
        </section>

        <div class="grid">
            <!-- Matrix Calculator -->
            <a href="calculator/matrix.html" class="card">
                <i class="fas fa-table-cells"></i>
                <h3>Matrix Calculator</h3>
            </a>

            <!-- Ohm's Law -->
            <a href="calculator/ohms-law.html" class="card">
                <i class="fas fa-bolt"></i>
                <h3>Ohm's Law</h3>
            </a>

            <!-- Complex Number -->
            <a href="calculator/complex.html" class="card">
                <i class="fas fa-square-root-variable"></i>
                <h3>Complex Numbers</h3>
            </a>

            <!-- Unit Converter -->
            <a href="calculator/unit-converter.html" class="card">
                <i class="fas fa-ruler-combined"></i>
                <h3>Unit Converter</h3>
            </a>

            <!-- Reference Section -->
            <a href="reference/index.html" class="card highlight">
                <i class="fas fa-book"></i>
                <h3>Engineering Reference</h3>
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <img src="engicalc2.0-logo.png" alt="Logo">
            <p>Made by <strong>Ayush Chatterjee</strong></p>
            <p>© 2026 EngiCalc 2.0. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
