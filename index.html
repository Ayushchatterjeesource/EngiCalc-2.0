<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiCalc 2.0 | Engineering Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="engicalc2.0-logo.png" alt="EngiCalc Logo">
                <span>EngiCalc 2.0</span>
            </div>
            <div class="nav-right">
                <button id="theme-toggle" class="icon-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h1>Engineering Blueprint 2.0</h1>
            <p>Advanced Tools for Professional Engineers</p>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="calcSearch" placeholder="Search for a calculator..." onkeyup="searchCalculators()">
            </div>
        </section>

        <!-- Calculators Grid -->
        <section class="grid-section">
            <h2 class="section-title">All Calculators</h2>
            <div class="calc-grid" id="calcGrid">
                <!-- Scientific -->
                <a href="calculator/scientific.html" class="calc-card">
                    <i class="fas fa-calculator"></i>
                    <h3>Scientific Calculator</h3>
                </a>
                <!-- Matrix -->
                <a href="calculator/matrix.html" class="calc-card">
                    <i class="fas fa-th"></i>
                    <h3>Matrix Calculator</h3>
                </a>
                <!-- Ohm's Law -->
                <a href="calculator/ohms-law.html" class="calc-card">
                    <i class="fas fa-bolt"></i>
                    <h3>Ohm’s Law</h3>
                </a>
                <!-- Kirchhoff’s Law -->
                <a href="calculator/kirchhoff.html" class="calc-card">
                    <i class="fas fa-wave-square"></i>
                    <h3>Kirchhoff’s Law</h3>
                </a>
                <!-- Projectile -->
                <a href="calculator/projectile.html" class="calc-card">
                    <i class="fas fa-rocket"></i>
                    <h3>Projectile Motion</h3>
                </a>
                <!-- Unit Converter -->
                <a href="calculator/unit-converter.html" class="calc-card">
                    <i class="fas fa-exchange-alt"></i>
                    <h3>Unit Converter</h3>
                </a>
                <!-- Statistics -->
                <a href="calculator/statistics.html" class="calc-card">
                    <i class="fas fa-chart-bar"></i>
                    <h3>Statistics</h3>
                </a>
                <!-- Vector -->
                <a href="calculator/vector.html" class="calc-card">
                    <i class="fas fa-arrows-up-down-left-right"></i>
                    <h3>Vector Calculator</h3>
                </a>
            </div>
        </section>

        <!-- Engineering Reference -->
        <section class="grid-section">
            <h2 class="section-title">Reference & Resources</h2>
            <div class="calc-grid">
                <a href="reference/constants.html" class="calc-card ref">
                    <i class="fas fa-atom"></i>
                    <h3>Engineering Constants</h3>
                </a>
                <a href="reference/formulas.html" class="calc-card ref">
                    <i class="fas fa-square-root-variable"></i>
                    <h3>Math Formulas</h3>
                </a>
            </div>
        </section>
    </main>
